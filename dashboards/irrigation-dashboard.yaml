            name: Flow baseline
          - entity: number.irrigation_zone_editor_high_flow
            name: High flow limit
          - entity: number.irrigation_zone_editor_low_flow
            name: Low flow limit
      - type: grid
        columns: 2
        square: false
        cards:
          - type: button
            entity: button.irrigation_zone_editor_save
            name: Save zone
            icon: mdi:content-save
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.irrigation_zone_editor_save
          - type: button
            entity: button.irrigation_zone_editor_revert
            name: Revert
            icon: mdi:undo
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.irrigation_zone_editor_revert
          - type: button
            entity: button.irrigation_zone_editor_learn_flow
            name: Learn flow
            icon: mdi:water-sync
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.irrigation_zone_editor_learn_flow
          - type: button
            entity: button.irrigation_zone_editor_test_run
            name: Test run (3 min)
            icon: mdi:play
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.irrigation_zone_editor_test_run
      - type: markdown
        title: Cycle and soak suggestion
        content: >-
          A button cannot choose a zone from another entity, so there is one Suggest button and one
          Apply button per zone. Suggest calls script.irrigation_suggest_zone with apply false and
          changes nothing. The script does not store its answer in an entity, so the suggested
          max cycle and soak minutes appear in the script response (Developer Tools, Actions, run
