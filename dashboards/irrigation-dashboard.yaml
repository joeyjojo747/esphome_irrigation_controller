# Irrigation dashboard (Home Assistant Lovelace, YAML / raw configuration editor).
# Seven views: overview, siteplan, calendar, programs, zones, water, settings.
#
# Native HA cards stand in for the three Ultra Card sections (overview summary, programs
# editor, zones editor). Each is marked "ULTRA CARD:"; Task 19 Step 4 replaces them with the
# Ultra Card visual-editor export on the user's HA. No Ultra Card schema is hand-written.
#
# Entity ids depend on the device name "irrigation-controller" (friendly name "Irrigation"):
# do not rename the device. tests/ha/test_dashboard.py checks every irrigation_* id used here.
# The site plan card is a copy of floorplan/irrigation-floorplan.yaml (a test keeps them equal).
title: Irrigation
views:
  # ---------------------------------------------------------------- overview
  - title: Overview
    path: overview
    icon: mdi:sprinkler-variant
    cards:
      # Alarm banners: each shows only while its binary sensor is on.
      - type: conditional
        conditions:
          - condition: state
            entity: binary_sensor.irrigation_leak
            state: "on"
        card:
          type: markdown
          content: "## LEAK DETECTED\nWater is flowing while no zone should be running. Check the pipes."
      - type: conditional
        conditions:
          - condition: state
            entity: binary_sensor.irrigation_flow_alarm
            state: "on"
        card:
          type: markdown
          content: "## FLOW ALARM\nThe flow rate is outside the learned range for the running zone."
      - type: conditional
        conditions:
          - condition: state
            entity: binary_sensor.irrigation_rain_hold
            state: "on"
        card:
          type: markdown
          content: "## RAIN HOLD\nWatering is held because of rain or a rain delay."
      # ULTRA CARD: replace with Ultra Card visual-editor export on the user's HA (Task 19 Step 4)
      - type: entities
        title: Status
        show_header_toggle: false
        entities:
          - entity: sensor.irrigation_status
            name: Status
          - entity: sensor.irrigation_active_zone
            name: Active zone
          - entity: sensor.irrigation_remaining_time
            name: Time remaining
          - entity: sensor.irrigation_flow_rate
            name: Flow
          - entity: sensor.irrigation_water_today
            name: Irrigation Water Today
          - entity: sensor.irrigation_cost_today
            name: Irrigation Cost Today
          - entity: sensor.irrigation_next_run
            name: Next run
          - entity: sensor.irrigation_weather_decision
            name: Weather decision
          - entity: sensor.irrigation_advice
            name: Advice
      - type: markdown
        title: Advice summary
        content: >-
          {{ state_attr('sensor.irrigation_advice', 'summary') or 'No advice yet.' }}
      - type: grid
        columns: 3
        square: false
        cards:
          - type: button
            name: Stop All
            icon: mdi:stop-circle
            tap_action:
              action: perform-action
              perform_action: esphome.irrigation_controller_stop_all
          - type: button
            name: Rain Delay 24h
            icon: mdi:weather-pouring
            tap_action:
              action: perform-action
              perform_action: esphome.irrigation_controller_rain_delay
              data:
                hours: 24
          - type: button
            name: Run Program A
            icon: mdi:play-circle
            tap_action:
              action: perform-action
              perform_action: esphome.irrigation_controller_run_program
              data:
                program: 0
  # ---------------------------------------------------------------- site plan
  - title: Site plan
    path: siteplan
    icon: mdi:map
    panel: true
    cards:
        # ha-floorplan (HACS: ExperienceLovelace/ha-floorplan) card for the irrigation site plan.
        # Copy www/irrigation/ to /config/www/irrigation/ (served as /local/irrigation/), then add this
        # as a card on the dashboard Site plan view. Rule syntax follows ha-floorplan v1.x.
        #
        # The Active Zone sensor holds the zone NAME (or None), not a number, so the alarm test uses
        # each zone own switch: switch on + flow alarm on == this is the active zone, and it is in alarm.
        #   switch unavailable/unknown -> zone-disabled
        #   switch on + flow alarm on  -> zone-alarm
        #   switch on                  -> zone-running
        #   otherwise                  -> zone-idle
      - type: custom:floorplan-card
        config:
          image: /local/irrigation/siteplan.svg
          stylesheet: /local/irrigation/siteplan.css
          rules:
            - entity: sensor.irrigation_status
              element: controller-1
              tap_action:
                action: more-info
              hover_action:
                action: hover-info
            - entities:
                - switch.irrigation_zone_1
                - binary_sensor.irrigation_flow_alarm
              element: zone-01
              tap_action:
                action: call-service
                service: script.irrigation_siteplan_run_zone
                service_data:
                  zone: 1
                  minutes: 5
                confirmation:
                  text: Run zone 1 for 5 minutes?
              state_action:
                action: call-service
                service: floorplan.class_set
                service_data:
                  class: >-
                    ${['unavailable', 'unknown'].includes(hass.states['switch.irrigation_zone_1'].state) ? 'zone-disabled' :
                    hass.states['switch.irrigation_zone_1'].state === 'on' ?
                    (hass.states['binary_sensor.irrigation_flow_alarm'].state === 'on' ? 'zone-alarm' : 'zone-running') :
                    'zone-idle'}
            - entities:
                - switch.irrigation_zone_2
                - binary_sensor.irrigation_flow_alarm
              element: zone-02
              tap_action:
                action: call-service
                service: script.irrigation_siteplan_run_zone
                service_data:
                  zone: 2
                  minutes: 5
                confirmation:
                  text: Run zone 2 for 5 minutes?
              state_action:
                action: call-service
                service: floorplan.class_set
                service_data:
                  class: >-
                    ${['unavailable', 'unknown'].includes(hass.states['switch.irrigation_zone_2'].state) ? 'zone-disabled' :
                    hass.states['switch.irrigation_zone_2'].state === 'on' ?
                    (hass.states['binary_sensor.irrigation_flow_alarm'].state === 'on' ? 'zone-alarm' : 'zone-running') :
                    'zone-idle'}
            - entities:
                - switch.irrigation_zone_3
                - binary_sensor.irrigation_flow_alarm
              element: zone-03
              tap_action:
                action: call-service
                service: script.irrigation_siteplan_run_zone
                service_data:
                  zone: 3
                  minutes: 5
                confirmation:
                  text: Run zone 3 for 5 minutes?
              state_action:
                action: call-service
                service: floorplan.class_set
                service_data:
                  class: >-
                    ${['unavailable', 'unknown'].includes(hass.states['switch.irrigation_zone_3'].state) ? 'zone-disabled' :
                    hass.states['switch.irrigation_zone_3'].state === 'on' ?
                    (hass.states['binary_sensor.irrigation_flow_alarm'].state === 'on' ? 'zone-alarm' : 'zone-running') :
                    'zone-idle'}
            - entities:
                - switch.irrigation_zone_4
                - binary_sensor.irrigation_flow_alarm
              element: zone-04
              tap_action:
                action: call-service
                service: script.irrigation_siteplan_run_zone
                service_data:
                  zone: 4
                  minutes: 5
                confirmation:
                  text: Run zone 4 for 5 minutes?
              state_action:
                action: call-service
                service: floorplan.class_set
                service_data:
                  class: >-
                    ${['unavailable', 'unknown'].includes(hass.states['switch.irrigation_zone_4'].state) ? 'zone-disabled' :
                    hass.states['switch.irrigation_zone_4'].state === 'on' ?
                    (hass.states['binary_sensor.irrigation_flow_alarm'].state === 'on' ? 'zone-alarm' : 'zone-running') :
                    'zone-idle'}
            - entities:
                - switch.irrigation_zone_5
                - binary_sensor.irrigation_flow_alarm
              element: zone-05
              tap_action:
                action: call-service
                service: script.irrigation_siteplan_run_zone
                service_data:
                  zone: 5
                  minutes: 5
                confirmation:
                  text: Run zone 5 for 5 minutes?
              state_action:
                action: call-service
                service: floorplan.class_set
                service_data:
                  class: >-
                    ${['unavailable', 'unknown'].includes(hass.states['switch.irrigation_zone_5'].state) ? 'zone-disabled' :
                    hass.states['switch.irrigation_zone_5'].state === 'on' ?
                    (hass.states['binary_sensor.irrigation_flow_alarm'].state === 'on' ? 'zone-alarm' : 'zone-running') :
                    'zone-idle'}
            - entities:
                - switch.irrigation_zone_6
                - binary_sensor.irrigation_flow_alarm
              element: zone-06
              tap_action:
                action: call-service
                service: script.irrigation_siteplan_run_zone
                service_data:
                  zone: 6
                  minutes: 5
                confirmation:
                  text: Run zone 6 for 5 minutes?
              state_action:
                action: call-service
                service: floorplan.class_set
                service_data:
                  class: >-
                    ${['unavailable', 'unknown'].includes(hass.states['switch.irrigation_zone_6'].state) ? 'zone-disabled' :
                    hass.states['switch.irrigation_zone_6'].state === 'on' ?
                    (hass.states['binary_sensor.irrigation_flow_alarm'].state === 'on' ? 'zone-alarm' : 'zone-running') :
                    'zone-idle'}
  # ---------------------------------------------------------------- calendar
  - title: Calendar
    path: calendar
    icon: mdi:calendar
    cards:
      - type: calendar
        title: Watering (list)
        initial_view: listWeek
        entities:
          - calendar.irrigation
      - type: calendar
        title: Watering (month)
        initial_view: dayGridMonth
        entities:
          - calendar.irrigation
      - type: markdown
        title: Upcoming watering
        content: >-
          {% set runs = state_attr('sensor.irrigation_upcoming', 'runs') or [] %}
          {% if runs | count == 0 %}Nothing scheduled in the next 14 days.{% endif %}
          {% for r in runs %}
          - {{ as_timestamp(r.start) | timestamp_custom('%a %d %b %H:%M') }}: {{ r.name }}, {{ r.minutes }} min ({{ r.pct }}%)
          {% endfor %}
  # ---------------------------------------------------------------- programs
  - title: Programs
    path: programs
    icon: mdi:calendar-clock
    cards:
      # ULTRA CARD: replace with Ultra Card visual-editor export on the user's HA (Task 19 Step 4)
      - type: entities
        title: Program editor
        show_header_toggle: false
        entities:
          - entity: select.irrigation_program_editor_program
            name: Program
          - entity: switch.irrigation_program_editor_enabled
            name: Enabled
          - entity: select.irrigation_program_editor_day_mode
            name: Day mode
          # Weekday switches: only when Day Mode = Weekdays.
          - type: conditional
            conditions:
              - condition: state
                entity: select.irrigation_program_editor_day_mode
                state: Weekdays
            row:
              entity: switch.irrigation_program_editor_mon
              name: Monday
          - type: conditional
            conditions:
              - condition: state
                entity: select.irrigation_program_editor_day_mode
                state: Weekdays
            row:
              entity: switch.irrigation_program_editor_tue
              name: Tuesday
          - type: conditional
            conditions:
              - condition: state
                entity: select.irrigation_program_editor_day_mode
                state: Weekdays
            row:
              entity: switch.irrigation_program_editor_wed
              name: Wednesday
          - type: conditional
            conditions:
              - condition: state
                entity: select.irrigation_program_editor_day_mode
                state: Weekdays
            row:
              entity: switch.irrigation_program_editor_thu
              name: Thursday
          - type: conditional
            conditions:
              - condition: state
                entity: select.irrigation_program_editor_day_mode
                state: Weekdays
            row:
              entity: switch.irrigation_program_editor_fri
              name: Friday
          - type: conditional
            conditions:
              - condition: state
                entity: select.irrigation_program_editor_day_mode
                state: Weekdays
            row:
              entity: switch.irrigation_program_editor_sat
              name: Saturday
          - type: conditional
            conditions:
              - condition: state
                entity: select.irrigation_program_editor_day_mode
                state: Weekdays
            row:
              entity: switch.irrigation_program_editor_sun
              name: Sunday
          # Interval numbers: only when Day Mode = Every N days.
          - type: conditional
            conditions:
              - condition: state
                entity: select.irrigation_program_editor_day_mode
                state: Every N days
            row:
              entity: number.irrigation_program_editor_interval_days
              name: Every N days
          - type: conditional
            conditions:
              - condition: state
                entity: select.irrigation_program_editor_day_mode
                state: Every N days
            row:
              entity: number.irrigation_program_editor_days_until_first_run
              name: Days until first run
          - type: section
            label: Start times
          - entity: switch.irrigation_program_editor_start_1_active
            name: Start 1 active
          - entity: datetime.irrigation_program_editor_start_1
            name: Start 1
          - entity: switch.irrigation_program_editor_start_2_active
            name: Start 2 active
          - entity: datetime.irrigation_program_editor_start_2
            name: Start 2
          - entity: switch.irrigation_program_editor_start_3_active
            name: Start 3 active
          - entity: datetime.irrigation_program_editor_start_3
            name: Start 3
          - entity: switch.irrigation_program_editor_start_4_active
            name: Start 4 active
          - entity: datetime.irrigation_program_editor_start_4
            name: Start 4
          - entity: switch.irrigation_program_editor_cycle_soak
            name: Cycle and soak
          - entity: switch.irrigation_program_editor_weather_adjust
            name: Weather adjust
          - entity: number.irrigation_program_editor_seasonal_adjust
            name: Seasonal adjust
      - type: entities
        title: Zone minutes (zones up to Zone Count)
        show_header_toggle: false
        entities:
          - entity: number.irrigation_zone_count
            name: Zone count
          - type: conditional
            conditions:
              - condition: numeric_state
                entity: number.irrigation_zone_count
                above: 0
            row:
              entity: number.irrigation_program_editor_zone_1_minutes
              name: Zone 1
          - type: conditional
            conditions:
              - condition: numeric_state
                entity: number.irrigation_zone_count
                above: 1
            row:
              entity: number.irrigation_program_editor_zone_2_minutes
              name: Zone 2
          - type: conditional
            conditions:
              - condition: numeric_state
                entity: number.irrigation_zone_count
                above: 2
            row:
              entity: number.irrigation_program_editor_zone_3_minutes
              name: Zone 3
          - type: conditional
            conditions:
              - condition: numeric_state
                entity: number.irrigation_zone_count
                above: 3
            row:
              entity: number.irrigation_program_editor_zone_4_minutes
              name: Zone 4
          - type: conditional
            conditions:
              - condition: numeric_state
                entity: number.irrigation_zone_count
                above: 4
            row:
              entity: number.irrigation_program_editor_zone_5_minutes
              name: Zone 5
          - type: conditional
            conditions:
              - condition: numeric_state
                entity: number.irrigation_zone_count
                above: 5
            row:
              entity: number.irrigation_program_editor_zone_6_minutes
              name: Zone 6
          - type: conditional
            conditions:
              - condition: numeric_state
                entity: number.irrigation_zone_count
                above: 6
            row:
              entity: number.irrigation_program_editor_zone_7_minutes
              name: Zone 7
          - type: conditional
            conditions:
              - condition: numeric_state
                entity: number.irrigation_zone_count
                above: 7
            row:
              entity: number.irrigation_program_editor_zone_8_minutes
              name: Zone 8
          - type: conditional
            conditions:
              - condition: numeric_state
                entity: number.irrigation_zone_count
                above: 8
            row:
              entity: number.irrigation_program_editor_zone_9_minutes
              name: Zone 9
          - type: conditional
            conditions:
              - condition: numeric_state
                entity: number.irrigation_zone_count
                above: 9
            row:
              entity: number.irrigation_program_editor_zone_10_minutes
              name: Zone 10
          - type: conditional
            conditions:
              - condition: numeric_state
                entity: number.irrigation_zone_count
                above: 10
            row:
              entity: number.irrigation_program_editor_zone_11_minutes
              name: Zone 11
          - type: conditional
            conditions:
              - condition: numeric_state
                entity: number.irrigation_zone_count
                above: 11
            row:
              entity: number.irrigation_program_editor_zone_12_minutes
              name: Zone 12
          - type: conditional
            conditions:
              - condition: numeric_state
                entity: number.irrigation_zone_count
                above: 12
            row:
              entity: number.irrigation_program_editor_zone_13_minutes
              name: Zone 13
          - type: conditional
            conditions:
              - condition: numeric_state
                entity: number.irrigation_zone_count
                above: 13
            row:
              entity: number.irrigation_program_editor_zone_14_minutes
              name: Zone 14
          - type: conditional
            conditions:
              - condition: numeric_state
                entity: number.irrigation_zone_count
                above: 14
            row:
              entity: number.irrigation_program_editor_zone_15_minutes
              name: Zone 15
          - type: conditional
            conditions:
              - condition: numeric_state
                entity: number.irrigation_zone_count
                above: 15
            row:
              entity: number.irrigation_program_editor_zone_16_minutes
              name: Zone 16
      - type: grid
        columns: 2
        square: false
        cards:
          - type: button
            entity: button.irrigation_program_editor_save
            name: Save program
            icon: mdi:content-save
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.irrigation_program_editor_save
          - type: button
            entity: button.irrigation_program_editor_revert
            name: Revert
            icon: mdi:undo
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.irrigation_program_editor_revert
  # ---------------------------------------------------------------- zones
  - title: Zones
    path: zones
    icon: mdi:sprinkler
    cards:
      # ULTRA CARD: replace with Ultra Card visual-editor export on the user's HA (Task 19 Step 4)
      - type: entities
        title: Zone editor
        show_header_toggle: false
        entities:
          - entity: select.irrigation_zone_editor_zone
