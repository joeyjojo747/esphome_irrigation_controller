<?xml version="1.0" encoding="UTF-8"?>
<!-- Irrigation site plan. Edit in Inkscape; see docs/install.md (Site plan).
     Keep element ids (controller-1, zone-NN, head-NN-MM): the floorplan rules use them. -->
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="12" height="12" fill="#9e9e9e" fill-opacity="0.35"/>
      <line x1="0" y1="0" x2="0" y2="12" stroke="#616161" stroke-width="4"/>
    </pattern>
  </defs>

  <g id="layer-background" inkscape:groupmode="layer" inkscape:label="Background">
    <image id="satellite" href="/local/irrigation/satellite.jpg" x="0" y="0" width="1600" height="1000" preserveAspectRatio="xMidYMid slice"/>
  </g>

  <g id="layer-zones" inkscape:groupmode="layer" inkscape:label="Zones">
    <polygon id="zone-01" class="zone-idle" data-zone="1" points="120,120 560,120 560,460 120,460"><title>Zone 1</title></polygon>
    <polygon id="zone-02" class="zone-idle" data-zone="2" points="600,120 1040,120 1040,460 600,460"><title>Zone 2</title></polygon>
    <polygon id="zone-03" class="zone-idle" data-zone="3" points="1080,120 1520,120 1520,460 1080,460"><title>Zone 3</title></polygon>
    <polygon id="zone-04" class="zone-idle" data-zone="4" points="120,500 560,500 560,840 120,840"><title>Zone 4</title></polygon>
    <polygon id="zone-05" class="zone-idle" data-zone="5" points="600,500 1040,500 1040,840 600,840"><title>Zone 5</title></polygon>
    <polygon id="zone-06" class="zone-idle" data-zone="6" points="1080,500 1520,500 1520,840 1080,840"><title>Zone 6</title></polygon>
  </g>

  <g id="layer-heads" inkscape:groupmode="layer" inkscape:label="Heads">
    <circle id="head-01-01" class="head-spray" cx="230" cy="290" r="9"/>
    <g id="head-01-02" class="head-rotor"><circle cx="450" cy="290" r="9"/><path d="M 430 290 a 20 20 0 0 1 20 20"/></g>
    <polygon id="head-02-01" class="head-rotator" points="710,279 700,298 720,298"/>
    <line id="head-02-02" class="head-drip" x1="900" y1="290" x2="960" y2="290"/>
    <rect id="head-03-01" class="head-bubbler" x="1182" y="282" width="16" height="16"/>
    <circle id="head-03-02" class="head-spray" cx="1410" cy="290" r="9"/>
    <g id="head-04-01" class="head-rotor"><circle cx="230" cy="670" r="9"/><path d="M 210 670 a 20 20 0 0 1 20 20"/></g>
    <polygon id="head-04-02" class="head-rotator" points="450,659 440,678 460,678"/>
    <line id="head-05-01" class="head-drip" x1="680" y1="670" x2="740" y2="670"/>
    <rect id="head-05-02" class="head-bubbler" x="922" y="662" width="16" height="16"/>
    <circle id="head-06-01" class="head-spray" cx="1190" cy="670" r="9"/>
    <g id="head-06-02" class="head-rotor"><circle cx="1410" cy="670" r="9"/><path d="M 1390 670 a 20 20 0 0 1 20 20"/></g>
  </g>

  <g id="layer-controllers" inkscape:groupmode="layer" inkscape:label="Controllers">
    <g id="controller-1" class="controller">
      <rect x="40" y="40" width="60" height="44" rx="6"/>
      <text x="70" y="68" text-anchor="middle">C1</text>
      <title>Irrigation controller</title>
    </g>
  </g>

  <g id="legend" transform="translate(1180,30)">
    <rect class="legend-bg" x="0" y="0" width="390" height="70" rx="6"/>
    <circle class="head-spray" cx="22" cy="24" r="9"/><text x="10" y="56">Spray</text>
    <g class="head-rotor"><circle cx="92" cy="24" r="9"/><path d="M 72 24 a 20 20 0 0 1 20 20"/></g><text x="72" y="56">Rotor</text>
    <polygon class="head-rotator" points="162,13 152,32 172,32"/><text x="140" y="56">Rotator</text>
    <line class="head-drip" x1="222" y1="24" x2="262" y2="24"/><text x="226" y="56">Drip</text>
    <rect class="head-bubbler" x="304" y="16" width="16" height="16"/><text x="285" y="56">Bubbler</text>
  </g>
</svg>
