text_sensor:
  # ISO-8601 UTC text keeps full precision (a float32 epoch is only good to ~2 minutes).
  # Empty text is unknown in Home Assistant when nothing is scheduled.
  - platform: template
    name: "Next Run"
    device_class: timestamp
    update_interval: 5s
    lambda: |-
      int32_t t = id(irr).next_run_ts();
      if (t <= 0) return std::string("");
      return ESPTime::from_epoch_utc((time_t) t).strftime("%Y-%m-%dT%H:%M:%SZ");
  - platform: template
    name: "Status"
    update_interval: 5s
    lambda: 'return id(irr).status_text();'
  - platform: template
    name: "Active Zone"
    update_interval: 5s
    lambda: 'return id(irr).active_zone_name();'
  - platform: template
    name: "Active Program"
    update_interval: 5s
    lambda: 'return id(irr).active_program_name();'

binary_sensor:
  - platform: template
    name: "Rain Hold"
    lambda: 'return id(irr).rain_hold();'
  - platform: template
    name: "Leak"
    device_class: problem
    lambda: 'return id(irr).leak_active();'
  - platform: template
    name: "Flow Alarm"
    device_class: problem
    lambda: 'return id(irr).flow_alarm_active();'
  - platform: template
    name: "Clock Valid"
    lambda: 'return id(irr).clock_valid();'
  - platform: template
    name: "HA Connected"
    device_class: connectivity
    lambda: 'return api::global_api_server->is_connected();'

button:
  - platform: template
    name: "Stop All"
    on_press:
      - lambda: 'id(irr).stop_all();'
  - platform: template
    name: "Rain Delay 24h"
    on_press:
      - lambda: 'id(irr).set_rain_delay_hours(24);'
  - platform: template
    name: "Clear Rain Delay"
    on_press:
      - lambda: 'id(irr).clear_rain_delay();'
