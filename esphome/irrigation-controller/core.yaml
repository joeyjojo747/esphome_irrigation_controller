irrigation_core:
  id: irr
  sprinkler_id: sprinkler_ctrl
  time_id: local_time
  flow_sensor: flow_rate
  output_candidates: ${output_candidates}
  reserved_pins:
    - "${flow_pin}"
    - "${rain_pin}"
    - "${start_pin}"
    - "${stop_pin}"
    - "${led_pin}"
    - "${sda_pin}"
    - "${scl_pin}"
  default_outputs: ${default_outputs}
  default_master_output: "${default_master_output}"
  on_event:
    - homeassistant.event:
        event: esphome.irrigation_event
        data:
          node: "${name}"
          type: !lambda 'return type;'
          json: !lambda 'return json;'

sensor:
  - platform: template
    name: "Weather Adjust"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    state_class: measurement
    update_interval: 5s
    lambda: 'return (float) id(irr).current_weather_pct();'
  - platform: template
    name: "Rain Last 24h"
    unit_of_measurement: "mm"
    accuracy_decimals: 1
