# Program editor. The buffer lives in RAM (a globals irrigation::Program); the entities
# edit it, Save copies it into the selected program and persists it, Revert reloads it.
# Selecting a program, pressing Revert and the set_program action all reload the
# entities from the core with publish_state (which does not trigger set actions).
irrigation_core:
  program_name_texts: [prog_name_1, prog_name_2, prog_name_3, prog_name_4, prog_name_5, prog_name_6, prog_name_7, prog_name_8]

esphome:
  on_boot:
    - priority: -100
      then:
        - script.execute: pe_load

globals:
  - id: pe_idx
    type: int
    initial_value: '0'
  - id: pe_buf
    type: irrigation::Program
  - id: pe_dtf
    type: int
    initial_value: '0'
  # Set when the day mode, interval or days-until-first is edited: only then does Save
  # re-anchor an Every-N-days program (otherwise its anchor is kept as loaded).
  - id: pe_dtf_dirty
    type: bool
    initial_value: 'false'
  - id: pe_shadow_1
    type: int
    initial_value: '480'
  - id: pe_shadow_2
    type: int
    initial_value: '480'
  - id: pe_shadow_3
    type: int
    initial_value: '480'
  - id: pe_shadow_4
    type: int
    initial_value: '480'

