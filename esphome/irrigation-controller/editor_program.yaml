  - platform: template
    id: pe_start_1
    name: "Program Editor Start 1"
    type: time
    entity_category: config
    optimistic: true
    set_action:
      - lambda: |-
          id(pe_shadow_1) = x.hour * 60 + x.minute;
          if (id(pe_buf).start_minutes[0] >= 0) id(pe_buf).start_minutes[0] = (int16_t) id(pe_shadow_1);
  - platform: template
    id: pe_start_2
    name: "Program Editor Start 2"
    type: time
    entity_category: config
