button:
  - platform: template
    id: pe_save
    name: "Program Editor Save"
    on_press:
      - lambda: |-
          const uint8_t i = (uint8_t) id(pe_idx);
          id(irr).program(i) = id(pe_buf);
          if (id(pe_buf).mode == irrigation::DayMode::INTERVAL && id(pe_dtf_dirty)) {
            int d = id(pe_dtf);
            const int n = id(pe_buf).interval_days < 1 ? 1 : id(pe_buf).interval_days;
            if (d >= n) d = n - 1;
            if (d < 0) d = 0;
            id(irr).set_program_interval_offset(i, (uint8_t) d);
          }
          id(pe_dtf_dirty) = false;
          id(irr).save_program(i);
  - platform: template
    id: pe_revert
    name: "Program Editor Revert"
    on_press:
      - script.execute: pe_load
