script:
  - id: pe_load
    mode: restart
    then:
      - lambda: |-
          const uint8_t i = (uint8_t) id(pe_idx);
          id(pe_buf) = id(irr).program(i);
          const auto &b = id(pe_buf);
          static const char *const modes[] = {"Weekdays", "Odd days", "Even days", "Every N days"};
          id(pe_enabled).publish_state(b.enabled);
          id(pe_mode).publish_state(modes[(uint8_t) b.mode < 4 ? (uint8_t) b.mode : 0]);
          id(pe_wd_0).publish_state(((b.weekday_mask >> 0) & 1) != 0);
          id(pe_wd_1).publish_state(((b.weekday_mask >> 1) & 1) != 0);
          id(pe_wd_2).publish_state(((b.weekday_mask >> 2) & 1) != 0);
          id(pe_wd_3).publish_state(((b.weekday_mask >> 3) & 1) != 0);
          id(pe_wd_4).publish_state(((b.weekday_mask >> 4) & 1) != 0);
          id(pe_wd_5).publish_state(((b.weekday_mask >> 5) & 1) != 0);
          id(pe_wd_6).publish_state(((b.weekday_mask >> 6) & 1) != 0);
          id(pe_interval).publish_state((float) b.interval_days);
          id(pe_dtf) = id(irr).program_days_until_first(i);  // 0 until the clock is valid
          id(pe_dtf_dirty) = false;
          id(pe_dtf_num).publish_state((float) id(pe_dtf));
          if (b.start_minutes[0] >= 0) id(pe_shadow_1) = b.start_minutes[0];
          id(pe_start_1).make_call().set_time(id(pe_shadow_1) / 60, id(pe_shadow_1) % 60, 0).perform();
          id(pe_start_1_on).publish_state(b.start_minutes[0] >= 0);
          if (b.start_minutes[1] >= 0) id(pe_shadow_2) = b.start_minutes[1];
          id(pe_start_2).make_call().set_time(id(pe_shadow_2) / 60, id(pe_shadow_2) % 60, 0).perform();
          id(pe_start_2_on).publish_state(b.start_minutes[1] >= 0);
          if (b.start_minutes[2] >= 0) id(pe_shadow_3) = b.start_minutes[2];
          id(pe_start_3).make_call().set_time(id(pe_shadow_3) / 60, id(pe_shadow_3) % 60, 0).perform();
          id(pe_start_3_on).publish_state(b.start_minutes[2] >= 0);
          if (b.start_minutes[3] >= 0) id(pe_shadow_4) = b.start_minutes[3];
          id(pe_start_4).make_call().set_time(id(pe_shadow_4) / 60, id(pe_shadow_4) % 60, 0).perform();
          id(pe_start_4_on).publish_state(b.start_minutes[3] >= 0);
          id(pe_zone_1).publish_state((float) ((b.zone_seconds[0] + 30) / 60));
          id(pe_zone_2).publish_state((float) ((b.zone_seconds[1] + 30) / 60));
          id(pe_zone_3).publish_state((float) ((b.zone_seconds[2] + 30) / 60));
          id(pe_zone_4).publish_state((float) ((b.zone_seconds[3] + 30) / 60));
          id(pe_zone_5).publish_state((float) ((b.zone_seconds[4] + 30) / 60));
          id(pe_zone_6).publish_state((float) ((b.zone_seconds[5] + 30) / 60));
          id(pe_zone_7).publish_state((float) ((b.zone_seconds[6] + 30) / 60));
          id(pe_zone_8).publish_state((float) ((b.zone_seconds[7] + 30) / 60));
          id(pe_zone_9).publish_state((float) ((b.zone_seconds[8] + 30) / 60));
          id(pe_zone_10).publish_state((float) ((b.zone_seconds[9] + 30) / 60));
          id(pe_zone_11).publish_state((float) ((b.zone_seconds[10] + 30) / 60));
          id(pe_zone_12).publish_state((float) ((b.zone_seconds[11] + 30) / 60));
          id(pe_zone_13).publish_state((float) ((b.zone_seconds[12] + 30) / 60));
          id(pe_zone_14).publish_state((float) ((b.zone_seconds[13] + 30) / 60));
          id(pe_zone_15).publish_state((float) ((b.zone_seconds[14] + 30) / 60));
          id(pe_zone_16).publish_state((float) ((b.zone_seconds[15] + 30) / 60));
          id(pe_seasonal).publish_state((float) b.seasonal_pct);
          id(pe_cycle_soak).publish_state(b.cycle_soak);
          id(pe_weather).publish_state(b.weather_adjust);

select:
  - platform: template
    id: pe_program
    name: "Program Editor Program"
    entity_category: config
    optimistic: true
    options: [A, B, C, D, E, F, G, H]
    set_action:
      - lambda: |-
          static const char *const o[] = {"A", "B", "C", "D", "E", "F", "G", "H"};
          for (int i = 0; i < 8; i++)
            if (x == o[i]) id(pe_idx) = i;
      - script.execute: pe_load
  - platform: template
    id: pe_mode
    name: "Program Editor Day Mode"
    entity_category: config
    optimistic: true
    options: [Weekdays, Odd days, Even days, Every N days]
    set_action:
      - lambda: |-
          static const char *const o[] = {"Weekdays", "Odd days", "Even days", "Every N days"};
          for (int i = 0; i < 4; i++)
            if (x == o[i]) id(pe_buf).mode = (irrigation::DayMode) i;
          id(pe_dtf_dirty) = true;

switch:
  - platform: template
    id: pe_enabled
    name: "Program Editor Enabled"
    entity_category: config
    restore_mode: DISABLED
    optimistic: true
    turn_on_action:
      - lambda: 'id(pe_buf).enabled = true;'
    turn_off_action:
      - lambda: 'id(pe_buf).enabled = false;'
  - platform: template
    id: pe_wd_0
    name: "Program Editor Mon"
