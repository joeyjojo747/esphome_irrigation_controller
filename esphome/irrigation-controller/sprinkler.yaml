# Sixteen valve slots. The core owns run times and sequencing; the sprinkler
# controller only provides pump/valve ordering and the Zone N switches.
sprinkler:
  - id: sprinkler_ctrl
    main_switch:
      name: "Irrigation Main"
      internal: true
    auto_advance_switch:
      name: "Irrigation Auto Advance"
      internal: true
    pump_start_pump_delay: 2s
    pump_stop_valve_delay: 2s
    valves:
      - valve_switch: "Zone 1"
        valve_switch_id: zone_out_1
        pump_switch_id: master_out
        run_duration: 15min
      - valve_switch: "Zone 2"
        valve_switch_id: zone_out_2
        pump_switch_id: master_out
        run_duration: 15min
      - valve_switch: "Zone 3"
