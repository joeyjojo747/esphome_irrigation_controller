select:
  - platform: template
    id: set_relay_level
    name: "Relay Trigger Level"
    entity_category: config
    optimistic: true
    options:
      - Active high
      - Active low
    set_action:
      - lambda: 'id(irr).set_relay_active_high(x == "Active high");'
  - platform: template
    id: set_rain_type
    name: "Rain Sensor Type"
    entity_category: config
    optimistic: true
    options:
      - None
      - Switch NC
      - Switch NO
      - Tipping bucket
    set_action:
      - lambda: |-
          static const char *const o[] = {"None", "Switch NC", "Switch NO", "Tipping bucket"};
          for (int i = 0; i < 4; i++)
            if (x == o[i]) id(irr).settings().rain_type = (irrigation::RainType) i;
          id(irr).save_settings();
  - platform: template
    id: set_start_short
    name: "Start Button Short Press"
    entity_category: config
    optimistic: true
    options: &button_fns
      - None
      - Run Program
      - Stop All
      - Next Zone
      - Rain Delay 24h
    set_action:
      - lambda: |-
          static const char *const o[] = {"None", "Run Program", "Stop All", "Next Zone", "Rain Delay 24h"};
          for (int i = 0; i < 5; i++)
            if (x == o[i]) id(irr).settings().start_short_fn = (irrigation::ButtonFn) i;
          id(irr).save_settings();
  - platform: template
    id: set_start_long
    name: "Start Button Long Press"
    entity_category: config
    optimistic: true
    options: *button_fns
    set_action:
      - lambda: |-
          static const char *const o[] = {"None", "Run Program", "Stop All", "Next Zone", "Rain Delay 24h"};
          for (int i = 0; i < 5; i++)
            if (x == o[i]) id(irr).settings().start_long_fn = (irrigation::ButtonFn) i;
          id(irr).save_settings();
  - platform: template
    id: set_stop_short
    name: "Stop Button Short Press"
    entity_category: config
    optimistic: true
    options: *button_fns
    set_action:
      - lambda: |-
          static const char *const o[] = {"None", "Run Program", "Stop All", "Next Zone", "Rain Delay 24h"};
          for (int i = 0; i < 5; i++)
            if (x == o[i]) id(irr).settings().stop_short_fn = (irrigation::ButtonFn) i;
          id(irr).save_settings();
  - platform: template
    id: set_stop_long
    name: "Stop Button Long Press"
    entity_category: config
    optimistic: true
    options: *button_fns
    set_action:
      - lambda: |-
          static const char *const o[] = {"None", "Run Program", "Stop All", "Next Zone", "Rain Delay 24h"};
          for (int i = 0; i < 5; i++)
            if (x == o[i]) id(irr).settings().stop_long_fn = (irrigation::ButtonFn) i;
          id(irr).save_settings();
  - platform: template
    id: set_button_program
    name: "Button Program"
    entity_category: config
    optimistic: true
    options: [A, B, C, D, E, F, G, H]
    set_action:
      - lambda: |-
          static const char *const o[] = {"A", "B", "C", "D", "E", "F", "G", "H"};
          for (int i = 0; i < 8; i++)
            if (x == o[i]) id(irr).settings().button_program = (uint8_t) i;
          id(irr).save_settings();

switch:
  - platform: template
    id: set_controller_enabled
    name: "Controller Enabled"
    restore_mode: DISABLED
    optimistic: true
    turn_on_action:
      - lambda: |-
          id(irr).settings().controller_enabled = true;
          id(irr).save_settings();
    turn_off_action:
      - lambda: |-
          id(irr).settings().controller_enabled = false;
          id(irr).save_settings();
  - platform: template
    id: set_rain_stops
    name: "Rain Sensor Stops Watering"
    restore_mode: DISABLED
    entity_category: config
    optimistic: true
    turn_on_action:
      - lambda: |-
          id(irr).settings().rain_sensor_stops_running = true;
          id(irr).save_settings();
    turn_off_action:
      - lambda: |-
          id(irr).settings().rain_sensor_stops_running = false;
          id(irr).save_settings();

text_sensor:
  # e.g. "Zone 2: GPIO 21 already assigned to Master" after a rejected output change.
  - platform: template
    name: "Last Error"
    entity_category: diagnostic
    update_interval: 5s
    lambda: 'return id(irr).last_error();'
