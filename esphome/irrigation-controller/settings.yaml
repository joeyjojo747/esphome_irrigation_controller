# Every setting is editable from Home Assistant with no reflash. The core is the
# source of truth: entities are optimistic with no restore_value, publish their
# value from id(irr).settings() at boot, and write back + save_settings() on change.
# Boot publishing uses publish_state (not number.set) so it does not re-save flash.
esphome:
  on_boot:
    - priority: -100
      then:
        - script.execute: settings_publish

# Also run after the set_settings API action so the entities show the new values.
script:
  - id: settings_publish
    mode: restart
    then:
      - lambda: |-
          auto &s = id(irr).settings();
          id(set_zone_count).publish_state((float) s.zone_count);
          id(set_ppl).publish_state(s.pulses_per_litre);
          id(set_leak).publish_state(s.leak_lpm);
          id(set_settle).publish_state((float) s.flow_settle_s);
          id(set_mm_tip).publish_state(s.mm_per_tip);
          id(set_rain_skip).publish_state(s.rain_skip_mm);
          id(set_zone_cap).publish_state((float) (s.zone_hard_cap_s / 60));
          id(set_controller_enabled).publish_state(s.controller_enabled);
          id(set_rain_stops).publish_state(s.rain_sensor_stops_running);
          id(set_relay_level).publish_state(s.relay_active_high ? "Active high" : "Active low");
          {
            static const char *const rt[] = {"None", "Switch NC", "Switch NO", "Tipping bucket"};
            uint8_t i = (uint8_t) s.rain_type;
            id(set_rain_type).publish_state(rt[i < 4 ? i : 0]);
          }
          {
            static const char *const fn[] = {"None", "Run Program", "Stop All", "Next Zone", "Rain Delay 24h"};
            auto f = [](irrigation::ButtonFn v) { uint8_t i = (uint8_t) v; return i < 5 ? i : 0; };
            id(set_start_short).publish_state(fn[f(s.start_short_fn)]);
            id(set_start_long).publish_state(fn[f(s.start_long_fn)]);
            id(set_stop_short).publish_state(fn[f(s.stop_short_fn)]);
            id(set_stop_long).publish_state(fn[f(s.stop_long_fn)]);
          }
          {
            static const char *const pr[] = {"A", "B", "C", "D", "E", "F", "G", "H"};
            id(set_button_program).publish_state(pr[s.button_program < 8 ? s.button_program : 0]);
          }
          id(set_month_jan).publish_state((float) s.monthly_pct[0]);
          id(set_month_feb).publish_state((float) s.monthly_pct[1]);
          id(set_month_mar).publish_state((float) s.monthly_pct[2]);
          id(set_month_apr).publish_state((float) s.monthly_pct[3]);
          id(set_month_may).publish_state((float) s.monthly_pct[4]);
          id(set_month_jun).publish_state((float) s.monthly_pct[5]);
          id(set_month_jul).publish_state((float) s.monthly_pct[6]);
          id(set_month_aug).publish_state((float) s.monthly_pct[7]);
          id(set_month_sep).publish_state((float) s.monthly_pct[8]);
          id(set_month_oct).publish_state((float) s.monthly_pct[9]);
          id(set_month_nov).publish_state((float) s.monthly_pct[10]);
          id(set_month_dec).publish_state((float) s.monthly_pct[11]);

number:
  - platform: template
    id: set_zone_count
    name: "Zone Count"
    entity_category: config
    optimistic: true
    min_value: 1
    max_value: 16
    step: 1
    mode: box
    set_action:
      - lambda: |-
          id(irr).settings().zone_count = (uint8_t) x;
          id(irr).save_settings();
  - platform: template
    id: set_ppl
    name: "Pulses per Litre"
    entity_category: config
    optimistic: true
    min_value: 1
    max_value: 5000
    step: 1
    mode: box
    set_action:
      - lambda: |-
          id(irr).settings().pulses_per_litre = x;
          id(irr).save_settings();
  - platform: template
    id: set_leak
    name: "Leak Threshold"
    entity_category: config
    optimistic: true
    min_value: 0.1
    max_value: 20
    step: 0.1
    mode: box
    unit_of_measurement: "L/min"
    set_action:
      - lambda: |-
          id(irr).settings().leak_lpm = x;
          id(irr).save_settings();
  - platform: template
    id: set_settle
