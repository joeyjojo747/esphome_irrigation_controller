# Relay outputs. Every slot goes through the runtime output map in irrigation_core,
# so the pin behind a zone is chosen from Home Assistant (Settings), not here.
# The switches are internal: the sprinkler controller drives them and exposes Zone N.
switch:
  - platform: irrigation_core
    id: zone_out_1
    name: "Zone 1 Relay"
    slot: 1
    internal: true
    restore_mode: ALWAYS_OFF
