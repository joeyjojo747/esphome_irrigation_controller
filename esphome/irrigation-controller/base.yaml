# Base platform: chip, network, clock. Nothing here is irrigation-specific.
esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  framework:
    type: esp-idf

logger:

# An unattended controller must keep running its schedule with no Wi-Fi or Home
# Assistant, so neither api nor wifi may reboot the device (reboot_timeout: 0s).
api:
  reboot_timeout: 0s
  encryption:
    key: !secret api_key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret ap_password

ota:
  - platform: esphome
    password: !secret ota_password

web_server:
  version: 3

# Batch flash writes: settings are saved with an explicit sync, programs rarely change.
preferences:
  flash_write_interval: 5min

# Home Assistant is the preferred time source, SNTP the fallback. For a clock that
# survives power loss with no network, enable the optional rtc.yaml package.
time:
  - platform: homeassistant
    id: ha_time
    timezone: ${timezone}
  - platform: sntp
    id: local_time
    timezone: ${timezone}

i2c:
  sda: ${sda_pin}
  scl: ${scl_pin}

