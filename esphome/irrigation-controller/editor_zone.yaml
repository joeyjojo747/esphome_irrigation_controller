# Zone editor. Same buffer pattern as the program editor. Zone Editor Output is the
# irrigation_core select retargeted to the selected zone: it applies immediately
# (validated, stops watering and re-drives the hardware), not on Save, and Save
# keeps whatever output the zone has. Zone Editor Name writes the Zone N Name text
# at once. A flow baseline is only written on Save if it was edited here, so a
# baseline learned in the meantime is not overwritten.
irrigation_core:
  zone_name_texts: [zone_name_1, zone_name_2, zone_name_3, zone_name_4, zone_name_5, zone_name_6, zone_name_7, zone_name_8, zone_name_9, zone_name_10, zone_name_11, zone_name_12, zone_name_13, zone_name_14, zone_name_15, zone_name_16]

esphome:
  on_boot:
    - priority: -100
      then:
        - script.execute: ze_load

globals:
  - id: ze_idx
    type: int
    initial_value: '0'
  - id: ze_buf
    type: irrigation::Zone
  - id: ze_baseline_dirty
    type: bool
    initial_value: 'false'

