# Compile fixture: irrigation_core with an MCP23017 relay expander, a flow sensor,
# name texts, and lambdas that exercise the public C++ API.
substitutions:
  name: core-expander

esphome:
  name: ${name}

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: ../../esphome/irrigation-controller/components
    components: [irrigation_core]

logger:

# CI has no secrets: dummy literals only.
wifi:
  ssid: "ci-dummy-ssid"
  password: "ci-dummy-password"

api:

time:
  - platform: sntp
    id: local_time
    timezone: Australia/Sydney

i2c:
  sda: 19
  scl: 20

mcp23017:
  - id: mcp_relays
    address: 0x20

switch:
  - platform: irrigation_core
    id: zone_out_1
    name: "Zone 1 Relay"
    slot: 1
    internal: true
    restore_mode: ALWAYS_OFF
  - platform: irrigation_core
    id: zone_out_2
    name: "Zone 2 Relay"
    slot: 2
    internal: true
    restore_mode: ALWAYS_OFF
  - platform: irrigation_core
    id: master_out
    name: "Master Relay"
    slot: master
    internal: true
    restore_mode: ALWAYS_OFF

select:
  - platform: irrigation_core
    name: "Zone 1 Output"
    slot: 1
  - platform: irrigation_core
    name: "Zone 2 Output"
    slot: 2
  - platform: irrigation_core
    name: "Master Output"
    slot: master

sprinkler:
  - id: sprinkler_ctrl
    main_switch:
      name: "Irrigation Main"
      internal: true
    auto_advance_switch:
      name: "Irrigation Auto Advance"
      internal: true
    pump_start_pump_delay: 2s
    pump_stop_valve_delay: 2s
    valves:
      - valve_switch: "Zone 1"
        valve_switch_id: zone_out_1
        pump_switch_id: master_out
        run_duration: 15min
      - valve_switch: "Zone 2"
        valve_switch_id: zone_out_2
        pump_switch_id: master_out
        run_duration: 15min

text:
  - platform: template
    id: prog_name_1
    name: "Program 1 Name"
    optimistic: true
    max_length: 24
    mode: text
    restore_value: true
  - platform: template
    id: zone_name_1
    name: "Zone 1 Name"
    optimistic: true
    max_length: 24
    mode: text
    restore_value: true

sensor:
  - platform: template
    id: flow_rate
    name: "Flow Rate"
    unit_of_measurement: "L/min"
    update_interval: 1s
    lambda: 'return 0.0f;'
  - platform: template
    name: "Remaining Time"
    unit_of_measurement: "s"
    update_interval: 5s
    lambda: 'return (float) id(irr).remaining_s();'
  - platform: template
    name: "Total Water"
    unit_of_measurement: "L"
    update_interval: 5s
    lambda: 'return id(irr).total_litres() + id(irr).zone_litres_total(0) * 0 + id(irr).rain_mm_24h() * 0;'
  - platform: template
    name: "Next Run"
    device_class: timestamp
    update_interval: 5s
    lambda: 'return (float) id(irr).next_run_ts() + id(irr).current_weather_pct() * 0;'

text_sensor:
  - platform: template
    name: "Status"
    update_interval: 5s
    lambda: 'return id(irr).status_text();'
  - platform: template
    name: "Active Zone"
    update_interval: 5s
    lambda: 'return id(irr).active_zone_name() + id(irr).active_program_name() + id(irr).last_error();'

binary_sensor:
  - platform: template
    name: "Leak"
    lambda: 'return id(irr).leak_active() || id(irr).flow_alarm_active() || id(irr).rain_hold() || !id(irr).clock_valid() || id(irr).rain_delay_active();'

button:
  - platform: template
    name: "Exercise API"
    on_press:
      - lambda: |-
          auto &core = *id(irr);
          irrigation::Settings &s = core.settings();
          s.zone_count = 2;
          core.save_settings();
          irrigation::Program &p = core.program(0);
          p.zone_seconds[0] = 300;
          core.set_program_interval_offset(0, 1);
          core.save_program(0);
          irrigation::Zone &z = core.zone(0);
          z.precip_mm_h = 35.0f;
          core.save_zone(0);
          if (core.assign_zone_output(1, irrigation::parse_output_label("MCP A1")) != irrigation::PinError::OK)
            ESP_LOGW("test", "%s", core.last_error().c_str());
          core.assign_master_output(21);
          core.set_relay_active_high(true);
          core.run_zone(0, 60);
          core.run_program(0);
          core.next_zone();
          core.learn_flow(1);
          core.set_rain_delay_hours(24);
          core.clear_rain_delay();
          core.set_weather_adjust(80, false, "mild", 30);
          core.rain_tip();
          core.set_rain_switch(false);
          core.button_press(true, false);
          core.stop_all();
          ESP_LOGI("test", "%s %s %s", core.plan_json(7).c_str(), core.runlog_json(0).c_str(),
                   core.config_json().c_str());

interval:
  - interval: 50ms
    then:
      - lambda: 'if (id(irr).status_led_level()) {}'

irrigation_core:
  id: irr
  sprinkler_id: sprinkler_ctrl
  time_id: local_time
  flow_sensor: flow_rate
  output_candidates: [1, 2, 3, 6, 7, 18, 21]
  reserved_pins: [19, 20, 22, 23, 14, 10, 11]
  expander_id: mcp_relays
  default_outputs: [1, 2]
  default_master_output: 21
  program_name_texts: [prog_name_1]
  zone_name_texts: [zone_name_1]
  on_event:
    - logger.log:
        format: "event %s %s"
        args: ['type.c_str()', 'json.c_str()']
