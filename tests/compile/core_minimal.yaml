# Compile fixture: irrigation_core with two valves and a master output, no expander.
substitutions:
  name: core-minimal

esphome:
  name: ${name}

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: ../../esphome/irrigation-controller/components
    components: [irrigation_core]

logger:

# CI has no secrets: dummy literals only.
wifi:
  ssid: "ci-dummy-ssid"
  password: "ci-dummy-password"

api:

time:
  - platform: sntp
    id: local_time
    timezone: Australia/Sydney

switch:
  - platform: irrigation_core
    id: zone_out_1
    name: "Zone 1 Relay"
    slot: 1
    internal: true
    restore_mode: ALWAYS_OFF
  - platform: irrigation_core
    id: zone_out_2
    name: "Zone 2 Relay"
    slot: 2
    internal: true
    restore_mode: ALWAYS_OFF
  - platform: irrigation_core
    id: master_out
    name: "Master Relay"
    slot: master
    internal: true
    restore_mode: ALWAYS_OFF

select:
  - platform: irrigation_core
    name: "Zone 1 Output"
    slot: 1
  - platform: irrigation_core
    name: "Master Output"
    slot: master

sprinkler:
  - id: sprinkler_ctrl
    main_switch:
      name: "Irrigation Main"
      internal: true
    auto_advance_switch:
      name: "Irrigation Auto Advance"
      internal: true
    pump_start_pump_delay: 2s
    pump_stop_valve_delay: 2s
    valves:
      - valve_switch: "Zone 1"
        valve_switch_id: zone_out_1
        pump_switch_id: master_out
        run_duration: 15min
      - valve_switch: "Zone 2"
        valve_switch_id: zone_out_2
        pump_switch_id: master_out
        run_duration: 15min

irrigation_core:
  id: irr
  sprinkler_id: sprinkler_ctrl
  time_id: local_time
  output_candidates: [1, 2, 3, 6, 7, 18, 21]
  reserved_pins: [19, 20, 22, 23, 14, 10, 11]
  default_outputs: [1, 2]
  default_master_output: 21
  on_event:
    - homeassistant.event:
        event: esphome.irrigation_event
        data:
          node: "${name}"
          type: !lambda 'return type;'
          json: !lambda 'return json;'
